name: Deploy to EC2

# Trigger workflow on push to main
on:
  push:
    branches: [main]


jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          echo "Validating deployment secrets..."
          if [ -z "${{ secrets.EC2_HOST }}" ]; then
            echo " EC2_HOST secret is missing or empty"
            exit 1
          else
            echo " EC2_HOST is set"
          fi
          if [ -z "${{ secrets.EC2_USERNAME }}" ]; then
            echo " EC2_USERNAME secret is missing or empty"
            exit 1
          else
            echo " EC2_USERNAME is set"
          fi
          if [ -z "${{ secrets.EC2_SSH_KEY }}" ]; then
            echo " EC2_SSH_KEY secret is missing or empty"
            exit 1
          else
            echo " EC2_SSH_KEY is set"
          fi
          echo " All required secrets are present"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          timeout: 300s
          script_stop: true
          envs: GITHUB_DEPLOY_TOKEN
          script: |
            set -e
            BASE_DIR="/home/ubuntu"
            APP_NAME="svc-locations-django"
            APP_DIR="$BASE_DIR/$APP_NAME"
            BRANCH="${{ github.ref_name }}"

            cd "$APP_DIR"
            if [ -n "${GITHUB_DEPLOY_TOKEN}" ]; then
              git remote set-url origin "https://${GITHUB_DEPLOY_TOKEN}@github.com/${{ github.repository }}.git"
            fi
            # Fetch and reset to origin (avoids "divergent branches" on EC2)
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fdq || true

            if systemctl list-unit-files | grep -q "gunicorn.service"; then
              sudo systemctl restart gunicorn
              sleep 2
              sudo systemctl is-active --quiet gunicorn || (sudo systemctl status gunicorn --no-pager && exit 1)
            fi

            if systemctl list-unit-files | grep -q "nginx.service"; then
              sudo nginx -t
              sudo systemctl restart nginx
              sleep 1
              sudo systemctl is-active --quiet nginx || (sudo systemctl status nginx --no-pager && exit 1)
            fi
