name: Deploy to EC2

on:
  push:
    branches: [main, dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate secrets
        env:
          BRANCH: ${{ github.ref_name }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DEV_EC2_HOST: ${{ secrets.DEV_EC2_HOST }}
          DEV_EC2_USERNAME: ${{ secrets.DEV_EC2_USERNAME }}
          DEV_EC2_SSH_KEY: ${{ secrets.DEV_EC2_SSH_KEY }}
        run: |
          set -e
          echo "Validating deployment secrets for branch: $BRANCH"
          if [ "$BRANCH" = "dev" ]; then
            [ -n "$DEV_EC2_HOST" ] || { echo "DEV_EC2_HOST secret is missing or empty"; exit 1; }
            [ -n "$DEV_EC2_USERNAME" ] || { echo "DEV_EC2_USERNAME secret is missing or empty"; exit 1; }
            [ -n "$DEV_EC2_SSH_KEY" ] || { echo "DEV_EC2_SSH_KEY secret is missing or empty"; exit 1; }
            echo "Dev secrets present"
          else
            [ -n "$EC2_HOST" ] || { echo "EC2_HOST secret is missing or empty"; exit 1; }
            [ -n "$EC2_USERNAME" ] || { echo "EC2_USERNAME secret is missing or empty"; exit 1; }
            [ -n "$EC2_SSH_KEY" ] || { echo "EC2_SSH_KEY secret is missing or empty"; exit 1; }
            echo "Prod secrets present"
          fi

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        with:
          host: ${{ github.ref_name == 'dev' && secrets.DEV_EC2_HOST || secrets.EC2_HOST }}
          username: ${{ github.ref_name == 'dev' && secrets.DEV_EC2_USERNAME || secrets.EC2_USERNAME }}
          key: ${{ github.ref_name == 'dev' && secrets.DEV_EC2_SSH_KEY || secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          timeout: 300s
          script_stop: true
          envs: GITHUB_DEPLOY_TOKEN
          script: |
            set -e
            BASE_DIR="/home/ubuntu"
            APP_NAME="svc-locations-django"
            APP_DIR="$BASE_DIR/$APP_NAME"
            BRANCH="${{ github.ref_name }}"

            cd "$APP_DIR"
            if [ -n "${GITHUB_DEPLOY_TOKEN}" ]; then
              git remote set-url origin "https://${GITHUB_DEPLOY_TOKEN}@github.com/${{ github.repository }}.git"
            fi
            # Fetch and reset to origin (avoids "divergent branches" on EC2)
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            git clean -fdq || true

            # Install deps then migrate before restarting the app
            if [ -f "venv/bin/activate" ]; then
              # shellcheck disable=SC1091
              . venv/bin/activate
            fi
            pip install -r requirements.txt
            python manage.py migrate --noinput

            if systemctl list-unit-files | grep -q "gunicorn-locations.service"; then
              sudo systemctl restart gunicorn-locations.service
              sleep 2
              sudo systemctl is-active --quiet gunicorn-locations.service || (sudo systemctl status gunicorn-locations.service --no-pager && exit 1)
            fi

            if systemctl list-unit-files | grep -q "nginx.service"; then
              sudo nginx -t
              sudo systemctl restart nginx
              sleep 1
              sudo systemctl is-active --quiet nginx || (sudo systemctl status nginx --no-pager && exit 1)
            fi
